repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: bash -c 'cd /home/dev/Modulo/Repos/farna-context/.agents/worktrees/1.3-config-loading && PYTHONPATH=src .venv/bin/pytest'
        language: system
        types: [python]
        pass_filenames: false
        args: [-q, --timeout=120]